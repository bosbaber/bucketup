config:
  # Which content source to serve: "gcs" or "git"
  source: gcs

  gcs:
    bucketName: "bucketup-sample"

  git:
    # only ssh cloning is supported
    repository: ""
    branch: "main"
    access:
      isPrivate: true
      # The user should configure an ssh deploy key with RO permissions
      # on the repository, in a Kubernetes secret that already exists
      # in the release namespace.
      privateKeySecretName: ""
      privateKeySecretKey: "sshPrivateKey"


imageOverride:
  repository: ghcr.io/bosbaber
  name: bucketup

web:
  name: web
  enabled: true
  replicaCount: 2
  serviceAccount: {}
    # create: false
    # name: "webksa"
  # imagePullPolicy: IfNotPresent
  service:
    http:
      name: web
      type: ClusterIP
      ports:
        - port: 8080
          targetPort: http
          protocol: TCP
          name: http
  ports:
    - name: http
      containerPort: 8080
      protocol: TCP
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
  initContainers: []
  sidecars: []  
  env:
  - name: SOURCE
    valueFrom:
      configMapKeyRef:
        name: '{{ include "common.fullname" . }}-config'
        key: source
  - name: BUCKET_NAME
    valueFrom:
      configMapKeyRef:
        name: '{{ include "common.fullname" . }}-config'
        key: gcsBucketName
  - name: GIT_REPOSITORY
    valueFrom:
      configMapKeyRef:
        name: '{{ include "common.fullname" . }}-config'
        key: gitRepository
  - name: GIT_BRANCH
    valueFrom:
      configMapKeyRef:
        name: '{{ include "common.fullname" . }}-config'
        key: gitBranch
  # command: []
  # args: []
  # livenessProbe: {}
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3
    httpGet:
      path: /healthz
      port: 8080   
  # volumeMounts: []
  # securityContext: {}

configMap:
  name: "config"
  contentMap:
    - key: source
      valueRef: config.source
    - key: gcsBucketName
      valueRef: config.gcs.bucketName
    - key: gitRepository
      valueRef: config.git.repository
    - key: gitBranch
      valueRef: config.git.branch
